---
# Продуктовый контекст:
# Этап обновления локального DEV-контура из уже выбранного релиза.
# Он получает версию от этапа build_release.yml и выполняет только раскатку:
# DB-техработы, управление сервисами, доставку архивов на app VM, миграции,
# healthcheck и итоговый отчет.
#
# Этот файл отделен как внутренний этап pipeline, чтобы логика обновления не
# дублировалась в нескольких playbook. Оператор запускает playbooks/pipeline.yml,
# а не этот файл напрямую.

- name: Обновить локальный DEV-контур из подготовленного релиза
  hosts: app_servers
  gather_facts: false

  pre_tasks:
    - name: Загрузить переменные DEV-контура
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../group_vars/dev.yml"

    - name: Принять версию релиза из этапа подготовки
      ansible.builtin.set_fact:
        build_version: "{{ hostvars['localhost'].pipeline_build_version }}"
        use_latest_release: "{{ hostvars['localhost'].pipeline_use_latest_release | default(false) }}"
      when: hostvars['localhost'].pipeline_build_version is defined

    - name: Проверить наличие файла с vault-переменными
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../group_vars/vault.yml"
      delegate_to: localhost
      register: vault_file

    - name: Загрузить vault-переменные при наличии файла
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../group_vars/vault.yml"
      no_log: true
      when: vault_file.stat.exists

    - name: Проверить способ выбора релиза
      ansible.builtin.assert:
        that:
          - use_latest_release | bool or (build_version | length > 0)
        fail_msg: "Укажите build_version=... или use_latest_release=true."

    - name: Проверить локальную конфигурацию
      ansible.builtin.include_role:
        name: validate_local_config

  roles:
    - role: db_maintenance
      vars:
        sql_phase: before_unpack
    - role: service_control
      vars:
        service_phase: before_unpack
    - role: artifacts
    - role: service_control
      vars:
        service_phase: after_unpack
    - role: db_maintenance
      vars:
        sql_phase: before_migrate
    - role: app_update
    - role: db_maintenance
      vars:
        sql_phase: after_migrate
    - role: service_control
      vars:
        service_phase: after_migrate
    - role: healthcheck
    - role: reporting
