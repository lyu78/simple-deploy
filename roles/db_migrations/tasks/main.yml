---
- name: Find DB migration archives
  ansible.builtin.find:
    paths: "{{ selected_release_dir }}"
    patterns: "{{ item.pattern }}"
    file_type: file
    recurse: false
  delegate_to: localhost
  register: db_migration_artifact_find_results
  loop: "{{ db_migration_artifacts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check that every DB migration archive exists once
  ansible.builtin.assert:
    that:
      - item.files | length == 1
    fail_msg: >-
      Expected exactly one DB migration archive in {{ selected_release_dir }}
      for pattern {{ item.item.pattern }}, found {{ item.files | length }}.
  loop: "{{ db_migration_artifact_find_results.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Reset resolved DB migration archive paths
  ansible.builtin.set_fact:
    resolved_db_migration_artifacts: []

- name: Resolve DB migration archive paths
  ansible.builtin.set_fact:
    resolved_db_migration_artifacts: >-
      {{ (resolved_db_migration_artifacts | default([]))
      + [item.item | combine({'local_archive': (item.files | first).path})] }}
  loop: "{{ db_migration_artifact_find_results.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Prepare DB migration directories on DB VM
  ansible.builtin.shell: |
    set -euo pipefail
    ssh \
    -o BatchMode=yes \
    -o NumberOfPasswordPrompts=1 \
    -o ConnectTimeout=10 \
    -o StrictHostKeyChecking=no \
    -o UserKnownHostsFile=/dev/null \
    {{ db_vm_user }}@{{ db_vm_host }} \
      'set -euo pipefail
      mkdir -p "$(dirname "{{ item.remote_archive }}")"
      rm -rf "{{ item.remote_extract_path }}"
      mkdir -p "{{ item.remote_extract_path }}"'
  args:
    executable: /bin/bash
  delegate_to: localhost
  loop: "{{ resolved_db_migration_artifacts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Upload DB migration archives to DB VM
  ansible.builtin.shell: |
    set -euo pipefail
    scp \
    -o BatchMode=yes \
    -o NumberOfPasswordPrompts=1 \
    -o ConnectTimeout=10 \
    -o StrictHostKeyChecking=no \
    -o UserKnownHostsFile=/dev/null \
    "{{ item.local_archive }}" \
    {{ db_vm_user }}@{{ db_vm_host }}:"{{ item.remote_archive }}"
  args:
    executable: /bin/bash
  delegate_to: localhost
  loop: "{{ resolved_db_migration_artifacts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Unpack and validate DB migration archives on DB VM
  ansible.builtin.shell: |
    set -euo pipefail
    ssh \
    -o BatchMode=yes \
    -o NumberOfPasswordPrompts=1 \
    -o ConnectTimeout=10 \
    -o StrictHostKeyChecking=no \
    -o UserKnownHostsFile=/dev/null \
    {{ db_vm_user }}@{{ db_vm_host }} \
      'set -euo pipefail
      tar -xzf "{{ item.remote_archive }}" -C "{{ item.remote_extract_path }}"
      entrypoint_dir="{{ item.remote_extract_path }}/{{ item.entrypoint_dir }}"
      test -d "$entrypoint_dir"
      test "$(find "$entrypoint_dir" -maxdepth 1 -type f -name "{{ item.entrypoint_pattern }}" | wc -l)" -eq 1'
  args:
    executable: /bin/bash
  delegate_to: localhost
  loop: "{{ resolved_db_migration_artifacts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Execute DB migration SQL archives on DB VM
  ansible.builtin.shell: |
    set -euo pipefail
    ssh \
    -o BatchMode=yes \
    -o NumberOfPasswordPrompts=1 \
    -o ConnectTimeout=10 \
    -o StrictHostKeyChecking=no \
    -o UserKnownHostsFile=/dev/null \
    {{ db_vm_user }}@{{ db_vm_host }} \
      'set -euo pipefail
      cd "{{ item.remote_extract_path }}"
      sql_file="$(find "{{ item.entrypoint_dir }}" -maxdepth 1 -type f -name "{{ item.entrypoint_pattern }}" | sort | tail -n 1)"
      PGPASSWORD="{{ db_login_password }}" {{ db_psql_bin }} {% if item.sql_kind == "schema" %}--set=ON_ERROR_STOP=1{% endif %} --host="{{ db_psql_host }}" --port="{{ db_port }}" --username="{{ db_login_user }}" --dbname="{{ db_name }}" -f "$sql_file"'
  args:
    executable: /bin/bash
  delegate_to: localhost
  no_log: "{{ db_login_password | length > 0 }}"
  loop: "{{ resolved_db_migration_artifacts }}"
  loop_control:
    label: "{{ item.name }}"
