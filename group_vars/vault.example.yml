---
# Продуктовый контекст:
# Пример файла секретов для обновления локального контура. Скопируйте его в vault.yml,
# заполните реальные доступы и зашифруйте через ansible-vault. Секреты намеренно
# отделены от dev.yml, чтобы пути, порядок сервисов и продуктовое поведение можно было
# ревьюить без раскрытия паролей БД или будущих токенов.
#
# vault.yml игнорируется git.

# Скопировать в group_vars/vault.yml и зашифровать:
# ansible-vault encrypt group_vars/vault.yml
vault_db_login_user: postgres
vault_db_login_password: change-me

# SSH/GitLab-токены можно будет добавить сюда позже, если они станут частью этого playbook.
