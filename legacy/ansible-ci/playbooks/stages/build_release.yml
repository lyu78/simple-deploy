---
# Продуктовый контекст:
# Этап подготовки релиза для локального DEV-контура.
# Его задача - привести локальную сборочную среду в ожидаемое состояние,
# запустить существующий сборщик tools-ci/builder/create_release.py и передать следующему
# этапу конкретную версию релиза.
#
# Этот файл не является отдельной пользовательской точкой входа. Его подключает
# legacy/ansible-ci/playbooks/pipeline.yml, чтобы весь процесс оставался единым для оператора и
# для расписания.
#
# Если run_build=false, новая сборка не запускается. В этом режиме нужно указать
# build_version=<версия> или use_latest_release=true, чтобы Ansible понимал,
# какой уже собранный релиз раскатывать.

- name: Подготовить релиз на рабочей машине
  hosts: localhost
  gather_facts: false
  vars:
    run_build: true

  pre_tasks:
    - name: Загрузить переменные DEV-контура
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../group_vars/dev.yml"

    - name: Проверить параметры запуска без сборки
      ansible.builtin.assert:
        that:
          - run_build | bool or (build_version | length > 0) or (use_latest_release | bool)
        fail_msg: "Если run_build=false, укажите build_version=... или use_latest_release=true."

  tasks:
    - name: Проверить локальную конфигурацию
      ansible.builtin.include_role:
        name: validate_local_config

    - name: Подготовить .env перед сборкой
      ansible.builtin.include_role:
        name: prepare_build_config
      when: run_build | bool

    - name: Запустить существующий сборочный скрипт tools-ci/builder/create_release.py
      ansible.builtin.shell: "{{ build_command }}"
      args:
        executable: /bin/bash
      environment: "{{ build_environment }}"
      when: run_build | bool

    - name: Включить выбор новейшего релиза после сборки
      ansible.builtin.set_fact:
        use_latest_release: true
      when:
        - run_build | bool
        - build_version | length == 0

    - name: Найти директории релизов
      ansible.builtin.find:
        paths: "{{ local_release_root }}"
        file_type: directory
        recurse: false
      register: pipeline_release_dirs
      when: use_latest_release | bool

    - name: Завершить выполнение, если релизы не найдены
      ansible.builtin.fail:
        msg: "В {{ local_release_root }} не найдены директории релизов."
      when:
        - use_latest_release | bool
        - pipeline_release_dirs.files | length == 0

    - name: Запомнить версию релиза для этапа обновления
      ansible.builtin.set_fact:
        pipeline_build_version: >-
          {{ build_version if build_version | length > 0
          else ((pipeline_release_dirs.files | sort(attribute='mtime') | last).path | basename) }}
        pipeline_use_latest_release: false
