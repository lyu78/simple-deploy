# Продуктовый контекст:
# Inventory описывает логические цели локального DEV-контура, но не хранит
# реальные адреса и учетные записи. Эти значения читаются из локального .env,
# который не попадает в репозиторий.
#
# app VM используется для доставки backend/frontend-архивов, миграций,
# сервисных команд и healthcheck.
#
# DB VM проверяется как отдельная машина: dry run валидирует TCP, SSH и доступность
# PostgreSQL. DB-операции выполняются через psql на DB VM по SSH.
all:
  vars:
    default_local_env_file: "{{ ((inventory_dir | default('inventories/dev')) ~ '/../../../../.env') | realpath }}"
    local_env_file: "{{ lookup('ansible.builtin.env', 'SIMPLE_DEPLOY_ENV_FILE') | default(default_local_env_file, true) }}"
    app_vm_host: "{{ lookup('ansible.builtin.ini', 'APP_VM_HOST type=properties file=' ~ local_env_file) }}"
    app_vm_user: "{{ lookup('ansible.builtin.ini', 'APP_VM_USER type=properties file=' ~ local_env_file) }}"
    db_vm_host: "{{ lookup('ansible.builtin.ini', 'DB_VM_HOST type=properties file=' ~ local_env_file) }}"
    db_vm_user: "{{ lookup('ansible.builtin.ini', 'DB_VM_USER type=properties file=' ~ local_env_file) }}"
    ansible_timeout: 10
    ansible_ssh_retries: 0
    ansible_ssh_common_args: "-o NumberOfPasswordPrompts=1 -o ConnectTimeout=10"
  children:
    app_servers:
      hosts:
        local_app:
          ansible_host: "{{ app_vm_host }}"
          ansible_user: "{{ app_vm_user }}"
    db_servers:
      hosts:
        local_db:
          ansible_host: "{{ db_vm_host }}"
          ansible_user: "{{ db_vm_user }}"
