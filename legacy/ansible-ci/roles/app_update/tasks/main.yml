---
# Продуктовый контекст:
# Роль миграции приложения. После распаковки backend-файлов эта роль запускает
# Django management-команды, которые приводят развернутый код в рабочее состояние
# на локальном контуре: сначала миграции схемы/данных, затем синхронизация ролей/action.
#
# Команды настраиваемые, потому что реальная раскладка app VM может отличаться от текущей
# документации, но дефолтная продуктовая последовательность - migrate --fake, затем sync_action_role.

- name: Выполнить Django management-команды
  ansible.builtin.shell: |
    set -euo pipefail
    source "{{ app_venv_activate_path }}"
    {{ item }}
  args:
    chdir: "{{ app_workdir }}"
    executable: /bin/bash
  loop: "{{ management_commands }}"
  loop_control:
    label: "{{ item }}"
