---
# Продуктовый контекст:
# Роль подготовки сборочной конфигурации. Перед запуском create_release.py она
# подставляет домены и URL в frontend .env-файлы из Ansible-переменных, чтобы
# реальные адреса не жили в .env как источник истины.

- name: Проверить, что список frontend .env задан
  ansible.builtin.assert:
    that:
      - frontend_env_files | length > 0
    fail_msg: "Заполните frontend_env_files в legacy/ansible-ci/group_vars/dev.yml."

- name: Создать рабочие frontend .env из шаблонов
  ansible.builtin.copy:
    src: "{{ item.template_path }}"
    dest: "{{ item.path }}"
    mode: "0644"
  loop: "{{ frontend_env_files }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost

- name: Подставить base backend URL в .env
  ansible.builtin.lineinfile:
    path: "{{ item.0.path }}"
    regexp: "^{{ item.1 }}="
    line: "{{ item.1 }}={{ item.0.base_url }}"
  loop: "{{ frontend_env_files | product(['REACT_APP_BASE_BACKEND_URL', 'VITE_BASE_BACKEND_URL']) | list }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}"
  delegate_to: localhost

- name: Подставить file proxy URL в .env
  ansible.builtin.lineinfile:
    path: "{{ item.0.path }}"
    regexp: "^{{ item.1 }}="
    line: "{{ item.1 }}={{ item.0.file_proxy_url }}"
  loop: "{{ frontend_env_files | product(['REACT_APP_FILE_PROXY_SERVICE_URL', 'VITE_FILE_PROXY_SERVICE_URL']) | list }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}"
  delegate_to: localhost

- name: Подставить filters URL в .env
  ansible.builtin.lineinfile:
    path: "{{ item.0.path }}"
    regexp: "^{{ item.1 }}="
    line: "{{ item.1 }}={{ item.0.filters_url }}"
  loop: "{{ frontend_env_files | product(['REACT_APP_FILTERS_SERVICE_URL', 'VITE_FILTERS_SERVICE_URL']) | list }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}"
  delegate_to: localhost

- name: Подставить версию сборки в .env при явном build_version
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: "^VITE_BUILD_VERSION="
    line: "VITE_BUILD_VERSION={{ build_version }}"
  loop: "{{ frontend_env_files }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  when: build_version | length > 0
